<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173B73">
  <title>看见冰山下的我</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main id="app" class="phone-shell" aria-live="polite"></main>

  <template id="iceberg-template">
    <button class="iceberg-button" type="button" aria-label="触碰冰山">
      <span class="iceberg-art">
        <span class="iceberg-peak peak-a"></span>
        <span class="iceberg-peak peak-b"></span>
        <span class="iceberg-peak peak-c"></span>
        <span class="waterline"></span>
        <span class="underberg under-a"></span>
        <span class="underberg under-b"></span>
        <span class="glow-ring"></span>
      </span>
    </button>
  </template>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
